{{define "admin_content"}}
<div class="max-w-2xl">
    <h1 class="text-2xl font-bold mb-6">{{.Title}}</h1>

    <form method="POST" action="{{.Action}}" data-submit-text="提交中...">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

        <div class="form-control">
            <label class="form-label">模型标识 (model_id)</label>
            {{if .FormModel.ID}}
            <input type="text" class="input" value="{{.FormModel.ModelID}}" readonly>
            <p class="text-sm opacity-60 mt-1">模型标识创建后不可修改</p>
            {{else}}
            <input type="text" class="input" name="model_id" value="{{.FormModel.ModelID}}"
                   placeholder="如：gpt-4o、claude-3-5-sonnet" required>
            <p class="text-sm opacity-60 mt-1">系统内唯一标识，创建后不可修改</p>
            {{end}}
        </div>

        <div class="form-control">
            <label class="form-label">显示名称</label>
            <input type="text" class="input" name="name" value="{{.FormModel.Name}}"
                   placeholder="如：GPT-4o、Claude 3.5 Sonnet" required>
        </div>

        <div class="form-control">
            <label class="form-label">协议</label>
            <select class="select" name="protocol" required>
                <option value="openai" {{if eq .FormModel.Protocol "openai"}}selected{{end}}>OpenAI 兼容</option>
                <option value="openai-response" {{if eq .FormModel.Protocol "openai-response"}}selected{{end}}>OpenAI Responses</option>
                <option value="anthropic" {{if eq .FormModel.Protocol "anthropic"}}selected{{end}}>Anthropic</option>
                <option value="gemini" {{if eq .FormModel.Protocol "gemini"}}selected{{end}}>Google Gemini</option>
            </select>
        </div>

        <div class="form-control">
            <label class="form-label">上游地址 (base_url)</label>
            <input type="url" class="input" name="base_url" value="{{.FormModel.BaseURL}}"
                   placeholder="如：https://api.openai.com/v1" required>
        </div>

        <div class="form-control">
            <label class="form-label">API Key</label>
            {{if .FormModel.ID}}
            <input type="password" class="input" name="api_key" placeholder="留空则不修改">
            <p class="text-sm opacity-60 mt-1">留空则保留当前密钥</p>
            {{else}}
            <input type="password" class="input" name="api_key" placeholder="上游接口密钥" required>
            {{end}}
        </div>

        <div class="form-control">
            <label class="form-label">上游模型 ID (api_model_id)</label>
            <input type="text" class="input" name="api_model_id" value="{{.FormModel.APIModelID}}"
                   placeholder="如：gpt-4o、claude-opus-4-6" required>
            <p class="text-sm opacity-60 mt-1">调用上游 API 时实际传递的模型名称</p>
        </div>

        <div class="flex gap-4">
            <div class="form-control" style="flex:1">
                <label class="form-label">最大输入 Token</label>
                <input type="number" class="input" name="max_input_tokens"
                       value="{{if .FormModel.MaxInputTokens}}{{.FormModel.MaxInputTokens}}{{else}}128000{{end}}"
                       min="1" max="10000000">
            </div>
            <div class="form-control" style="flex:1">
                <label class="form-label">最大输出 Token</label>
                <input type="number" class="input" name="max_output_tokens"
                       value="{{if .FormModel.MaxOutputTokens}}{{.FormModel.MaxOutputTokens}}{{else}}4096{{end}}"
                       min="1" max="1000000">
            </div>
        </div>

        <div class="form-control">
            <label class="form-label">思考等级</label>
            <select class="select" name="reasoning_effort">
                <option value="">不启用</option>
                <option value="low" {{if eq .FormModel.ReasoningEffort "low"}}selected{{end}}>低 (low)</option>
                <option value="medium" {{if eq .FormModel.ReasoningEffort "medium"}}selected{{end}}>中 (medium)</option>
                <option value="high" {{if eq .FormModel.ReasoningEffort "high"}}selected{{end}}>高 (high)</option>
            </select>
            <p class="text-sm opacity-60 mt-1">启用后模型将进行深度思考，支持 DeepSeek/OpenAI/Qwen/Kimi/MiniMax 等</p>
        </div>

        <div class="form-control">
            <label class="form-label">自动切换</label>
            <label class="checkbox-label">
                <input type="checkbox" name="is_auto" value="1"
                       {{if .FormModel.IsAuto}}checked{{end}}>
                <span>开启后参与自动切换（Agent 设为「自动切换」时按序尝试）</span>
            </label>
        </div>

        <div class="flex gap-3 pt-4">
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/admin/models" class="btn btn-ghost">取消</a>
        </div>
    </form>
</div>
{{end}}
