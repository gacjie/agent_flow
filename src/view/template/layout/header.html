{{define "header"}}
<header class="navbar">
    <div class="flex items-center justify-between w-full" style="padding:0 1.5rem;">
        <!-- 左侧：移动端菜单 + 站点名称 -->
        <div class="flex items-center gap-2">
            <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="菜单">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <a href="/admin" class="navbar-brand">AgentFlow</a>
        </div>

        <!-- 右侧：日夜切换 + 账号下拉 -->
        <div class="flex items-center gap-2">
            <button id="theme-toggle-btn" class="theme-toggle" aria-label="切换主题">
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
                </svg>
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
                </svg>
            </button>

            {{if .Admin}}
            <div class="dropdown">
                <button class="dropdown-toggle" data-dropdown>
                    <span>{{if .Admin.Nickname}}{{.Admin.Nickname}}{{else}}{{.Admin.Username}}{{end}}</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1rem;height:1rem;"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="dropdown-menu">
                    <div class="dropdown-item dropdown-header">{{.Admin.Username}}</div>
                    <div class="dropdown-divider"></div>
                    <a href="/admin/profile" class="dropdown-item">个人资料</a>
                    <a href="/admin/password" class="dropdown-item">修改密码</a>
                    <div class="dropdown-divider"></div>
                    <form action="/auth/logout" method="POST" style="margin:0;">
                        {{if .CSRFToken}}<input type="hidden" name="_csrf" value="{{.CSRFToken}}">{{end}}
                        <button type="submit" class="dropdown-item dropdown-danger" style="width:100%;text-align:left;background:none;border:none;font:inherit;cursor:pointer;">注销</button>
                    </form>
                </div>
            </div>
            {{else}}
            <a href="/auth/login" class="btn btn-ghost btn-sm">登录</a>
            {{end}}
        </div>
    </div>

    <!-- 移动端下拉菜单 -->
    {{if .Admin}}
    <div id="mobile-menu" class="mobile-menu">
        <div style="padding:0.5rem 0.75rem;font-weight:500;color:var(--text-muted);font-size:0.8rem;">{{.Admin.Username}}</div>
        <a href="/admin/profile">个人资料</a>
        <a href="/admin/password">修改密码</a>
        <form action="/auth/logout" method="POST" style="margin:0;">
            {{if .CSRFToken}}<input type="hidden" name="_csrf" value="{{.CSRFToken}}">{{end}}
            <button type="submit" style="width:100%;text-align:left;background:none;border:none;padding:0.5rem 0.75rem;border-radius:0.375rem;color:var(--color-error);font-size:0.875rem;cursor:pointer;">注销</button>
        </form>
    </div>
    {{end}}
</header>
{{end}}
