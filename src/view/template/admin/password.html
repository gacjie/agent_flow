{{define "admin_content"}}
<div class="max-w-lg">
    <h1 class="text-2xl font-bold mb-6">修改密码</h1>

    {{if .Error}}
    <div class="alert-error mb-6">{{.Error}}</div>
    {{end}}
    {{if .Success}}
    <div class="alert-success mb-6">{{.Success}}</div>
    {{end}}

    <form action="/admin/password" method="POST" data-submit-text="保存中...">
        <input type="hidden" name="_csrf" value="{{.CSRFToken}}">

        <div class="form-control">
            <label class="form-label">原密码</label>
            <input type="password" name="old_password" class="input"
                   placeholder="请输入原密码" required>
        </div>

        <div class="form-control">
            <label class="form-label">新密码</label>
            <input type="password" name="new_password" class="input"
                   placeholder="请输入新密码（至少6位）" required minlength="6">
        </div>

        <div class="flex gap-3 pt-4">
            <button type="submit" class="btn btn-primary">修改密码</button>
        </div>
    </form>
</div>
{{end}}
