{{define "content"}}
<div class="login-page">
    <div class="login-card">
        <!-- Logo 区域 -->
        <div class="login-header">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:2.5rem;height:2.5rem;color:var(--color-primary);">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <h1>AgentFlow</h1>
            <p>智能体工作流系统</p>
        </div>

        {{if .Error}}
        <div class="alert-error mb-6">{{.Error}}</div>
        {{end}}

        <form action="/auth/login" method="POST" data-submit-text="登录中...">
            <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
            <input type="hidden" name="captcha_id" id="captcha-id" value="{{.CaptchaID}}">

            <div class="form-control">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="input input-lg"
                       placeholder="请输入用户名" required autofocus>
            </div>

            <div class="form-control">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="input input-lg"
                       placeholder="请输入密码" required>
            </div>

            <div class="form-control">
                <label class="form-label">验证码</label>
                <div class="captcha-row">
                    <div id="captcha-svg" class="captcha-img">{{.CaptchaSVG}}</div>
                    <button type="button" id="captcha-refresh" class="captcha-refresh" title="换一个">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6"/><path d="M2.5 22v-6h6"/><path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8"/><path d="M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/></svg>
                    </button>
                </div>
                <input type="text" name="captcha" class="input input-lg mt-2"
                       placeholder="请输入计算结果" required autocomplete="off">
            </div>

            <div class="pt-4">
                <button type="submit" class="btn btn-primary btn-lg w-full">登录</button>
            </div>
        </form>

        <div class="login-footer">
            <p>&copy; 2026 AgentFlow</p>
        </div>
    </div>
</div>
{{end}}
